# User Options & Visual Overhaul for The Matrix Online
# Preempts autoexec.cfg defaults

# Display & Resolution (Modern 1080p 32-bit Borderless Windowed)
ScreenWidth = 1920
ScreenHeight = 1080
ScreenBitDepth = 32
Windowed = 1
NoSyncOnFlip = 1

# Anti-Aliasing & Texture Quality
AntiAliasFSOverSample = 4
AntiAliasFSQuality = 2
mipmap_bias = -0.6

# Post-Processing & Lighting Aesthetics (GreenShift, Screen Glow & Overbright)
ScreenFilters_Enable = 1
ScreenFilter_Enable_Overbright = 0
ScreenFilter_Enable_GreenShift = 1
ScreenFilters_GreenShift_Allow_Fallback = 1
ScreenFilters_Screen_Glow_Just_Glow = 0
ScreenFilters_Screen_Glow_BlurScale = 0.0
ScreenFilters_Screen_Glow_BrightFactor = 0.6
ScreenFilters_Screen_Glow_Trg_OutDoors_Day_BrightFactor = 0.4
WR_LensFlare_Scale = 0.0
dl_floorheight = 520
wr_lighting_downlight = 0.04
wr_drawshadows = 1
wr_ShadowAllowDoubleSided = 0
FX_Light_Glare_Alpha = 0.0

# UI & Font Scaling for High-Resolution Display (1080p+)
ConsoleFontSize = 14
Option_Font_Large = 14
Option_Font_Normal = 12
Option_Font_Small = 10
Option_Font_Tiny = 9
Use_State_Fonts = 1

# Camera Collision & Physics Tuning
CameraPhysics = 1
CameraDefaultDist = 450
CameraMinDist = 50
CameraMaxDist = 1000
CameraMaxSpeed = 450
CameraHeightOffset = 0.70
ILCameraMode = 1

# Locomotion & Wire-Fu Jump Tuning
WireFuJump = 1
JumpSpeed = 550
PlayerJumpHeight = 1.35
Gravity = -800
ClipSpeed = 1200
