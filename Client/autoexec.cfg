# These will set the player's initial position. They are each a number.
# They correspond to the second set of numbers that print to console
# when you hit F11 (ShowPlayerPos).  The player will be placed at the
# center of the indicated nav-poly.  If the indicated position
# does not exist, it will just pick a spot at random.
#
#
# StartSector = 0
# StartPrefab = 0
# StartNavPoly = 10

# Camera interpolation speed
CameraMaxSpeed = 350

# Speed to moving when clipping.
ClipSpeed = 1000

# Disable auto-play of cinematics...
Cin_Play_Never		= 1

# This is the default player description.  
# The numbers corresponds to those in resource\characters\RSI\tools_id_table.rsi.
PlayerBodyType = 100
PlayerHeadType = 100
PlayerHairType = 101

# The numbers corresponds to those in resource\characters\RSI\article-allocation.rsi.
PlayerHat = 0
PlayerShirt = 106
PlayerCoat = 110
PlayerCoatColor = 8
PlayerPants = 103
PlayerShoes = 100
PlayerShoesColor = 10
PlayerHand = 101
PlayerGlasses = 100
PlayerGlassesColor = 1
PlayerLeggings = 0
PlayerFacialHair = 0

# The sound we should make for foot steps.
LeftFootSoundID = 0x24000302
RightFootSoundID = 0x24000303

# Our ambient sound.  The volume goes from 0.0 to 1.0.
AmbientSoundVolume = 1
AmbientSoundID = 0

# audio voice limit for performance
audio_max_voices = 64

# Camera mode, equivalent to changing cameras.
# Valid cameras are :
#   0 -- Fixed Camera
#   1 -- Simple Camera
#   2 -- Chase camera 
CameraMode = 2

# Interlock Camera mode, equivalent to changing cameras while in combat.
# Valid cameras are :
#   0 -- Choreographed camera
#   1 -- Center Focused camera
#   2 -- Chase camera
ILCameraMode = 1

# The starting distance for the camera.
CameraDefaultDist = 450

# The starting pitch for the camera, in degrees..
# CameraDefaultPitch = 22.5

# Minimum and maximum allowable distances for the camera.
CameraMinDist = 50
CameraMaxDist = 1000

# Camera focal point as a factor of the half extents.
# ie. 1.0 is the player's head, 
#     0.0 is the player's bottom
#    -1.0 is the player's feet.
CameraHeightOffset = 0.70

# Set to 1 to get a camera that does not clip through walls.
CameraPhysics = 1

# This dictates the number of sample points
# the camera uses when doing physics.
#CameraHeightMapXSamples = 6
#CameraHeightMapYSamples = 5

# These are the values used for a debug build.
#CameraHeightMapDebugXSamples = 3
#CameraHeightMapDebugYSamples = 2

# Set this to zero to disable clearing of current target when clicking in the world.
TargetClearOnClick = 1

# Set to 0 to get full screen based mouse movement (left-click to start mouse movement).
#        1 to get "where you clicked" based mouse movement.
MouseMoveMode = 0

# The MouseTurnStartZone is the percentage of the 
# The MouseTurnStartZone is the percentage (0 - 100) of the half screen 
#  which is considered the "moving straight" area of the screen.  The
#  MouseTurnStopZone is the percentage of the screen at which the max turn
#  rate is reached.
#MouseTurnStartZone = 0
#MouseTurnStopZone = 100

# This the how fast to turn, in degrees per second, when the mouse is
#  in the turn buffer.  So if you are 10% into the turning buffer
#  and this is 180.0, you would turn 18 degrees per second.
#
#
#MouseMoveRotationScale = 1.5

# This value affects how fast the camera moves while in
# chase mode (the "squishy,bouncy" mode).  It is simply
# the number of seconds that it will take the camera to
# reach a static position.
#CameraChaseDuration = 0.75

# True means mouse controls player's movement.
MouseLook = 0

# The MouseLookStartZone is the percentage of the 
# The MouseLookStartZone is the percentage (0 - 100) of the half screen 
#  which is considered the "no adjustment" area of the screen.  The
#  MouseLookStopZone is the percentage of the screen at which the max camera pitch change
#  rate is reached.
MouseLookStartZone = 200
MouseLookStopZone = 200

# This dictates how much an object's xz dims are scaled to account
# for the distance of the object from the camera.  Further away objects
# are scaled up so that they are easier to "activate".  Closer objects
# are reduced so that they do not block futher away objects.
CursorMinScalingFactor = 1
#CursorMaxScalingFactor = 2.5

# Screen resolution
ScreenBitDepth = 32
ScreenHeight = 1080
ScreenWidth = 1920

# Run windowed (borderless / windowed).
Windowed = 1

# No VSync...
NoSyncOnFlip = 1

