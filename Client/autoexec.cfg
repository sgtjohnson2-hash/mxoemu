#include "options.cfg"
#include "useropts.cfg"


# Screen Filters & Matrix Aesthetic Shaders
ScreenFilters_Enable = 1
ScreenFilter_Enable_Overbright = 0
ScreenFilter_Enable_GreenShift = 1
ScreenFilters_GreenShift_Allow_Fallback = 1
ScreenFilters_Screen_Glow_Just_Glow = 0
ScreenFilters_Screen_Glow_BlurScale = 0.0
ScreenFilters_Screen_Glow_BrightFactor = 0.6
ScreenFilters_Screen_Glow_Trg_OutDoors_Day_BrightFactor = 0.4
WR_LensFlare_Scale = 0.0

# UI & Font Scaling (1080p+)
ConsoleFontSize = 14
Option_Font_Large = 14
Option_Font_Normal = 12
Option_Font_Small = 10
Option_Font_Tiny = 9
Use_State_Fonts = 1

# Enable generation of mini-dump files when the 
# game crashes so that engineers can perform
# an autopsy.
EnableCrashDumping = 1
EnableCrashDumpUploads = true

# Turn on console echoing 
ConsoleEchoToFile = 1

# Turn off automatic reloading of world when server updates our position
# to a point outside our currently loaded point.
DL_ServerUpdatePosReload = 0

# turning building shadows off by default for now (performance)
#wr_drawshadows = 0

# Leave blank to run server-less.  Otherwise give address of server.
# NetJoin = "hostname"

# Set this to 1 see the in game UI 
CreateViews = 1

#Interior day/night ambient level
wr_IntAmbientExtAmbientScale = 0.14

# set the localization
Localization = "English"
# Localization = "German"

#Interior Lense Flair Properties
FX_Light_Glare_Alpha = 0.0
FX_Light_Glare_Dst_0 = 1000
FX_Light_Glare_Dst_1 = 1400

# Water LOD Dst
wr_water_LOD_DstSqr = 800000000.0f

# Anti-Alias (default it off)...
AntiAliasFSOverSample	= 0
AntiAliasFSQuality		= 0

