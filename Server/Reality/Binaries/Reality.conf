# Reality configuration file

# Database connection settings.
Database.Hostname      = 127.0.0.1
Database.Username      = reality
Database.Password      = reality
Database.Name          = reality
Database.Port          = 3307

AuthServer.Port = 11000
MarginServer.Port = 10000
GameServer.Port = 10000

MarginServer.AllowMultipleSessionsPerCharacter = false
GameServer.ChatPrefix = SOE+MXO
GameServer.WorldName = Reality

#LOGLEVEL_CRITICAL = 1
#LOGLEVEL_ERROR = 2
#LOGLEVEL_WARNING = 3
#LOGLEVEL_INFO = 4
#LOGLEVEL_DEBUG = 5
Log.ConsoleLogLevel = 5
Log.FileLogLevel = 3

# Bot Population Management (<150 MiB RSS Target)
BotManager.InitialPopulation = 350
BotManager.ActiveBotLimit = 500

# Combat Hit FX (0 = safe/no EffectID attribute, 0xDF060028 = HDS wire byte order, 0x280006DF = legacy)
Combat.HitFx = 0

# Interlock state framing: 3 = HDS capture (03 01 00 02 [len] [ilView] 01 ...), the only one the client accepts; 0-2 are broken experiments
Interlock.UpdateMode = 3

# Authentic Retail Interlock Database Move Selection
Interlock.UseDynamicILDB = 1

# Interlock values from the HDS interlock-start capture, hd_reference/hds/world/Client/RpcHandlers/CombatHandler.cs L37, L58-77
# Handler GO id: 55 = HDS Object55 "ILCombatHandler" (GameObjectDefinitions.cs:37009); 27 = alternative from commit 95ed54e9
Interlock.HandlerGoId = 55
# Slot order: hds = slot 1 opponent, slot 2 self (L64-66); self = slot 1 self, slot 2 opponent
Interlock.SlotOrder = hds
# Exchange timing: start 0x113 = 275, then 0x534 = 1332 and 0x29A = 666 (L76)
Interlock.ExchangeStartMs = 275
Interlock.ExchangeDurMs = 1332
Interlock.ExchangeContactMs = 666
# Exchange style byte: 0 as in L76; -1 = send the attacker's fighting-style enum (old behaviour)
Interlock.ExchangeStyleByte = 0
# Main move ids: ildb = client move database (current); capture = only 0x2026/0x236D/0x2367 (+0x4EE5) seen in captures
Interlock.MoveSet = ildb
# GO 55 StartTime encoding: 1 = u32 sim milliseconds (client.dll FUN_625f6580 reads u32, /1000 and %1000)
# 0 = float sim seconds (old; the client read it as a time ~14 days ahead), 2 = float milliseconds
Interlock.StartTimeMode = 1
# Spawn counter byte in our own avatar handle (view 2). 47 = 0x2F, what our self spawn sends; HDS sent 0
Interlock.SelfSpawnCounter = 47

